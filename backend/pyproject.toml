[project]
name = "finpilot-ai-backend"
version = "0.1.0"
description = "FastAPI backend for FinPilot AI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
