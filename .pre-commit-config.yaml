default_install_hook_types:
  - pre-commit
  - pre-push

ci:
  autofix_commit_msg: "chore: apply pre-commit fixes"
  autoupdate_commit_msg: "chore: update pre-commit hooks"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^backend/

  - repo: local
    hooks:
      - id: backend-tests
        name: backend tests with coverage
        entry: bash -c 'cd backend && python -m pytest'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: frontend-tests
        name: frontend tests with coverage
        entry: bash -c 'cd frontend && npm run test:coverage'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: frontend-build
        name: frontend production build
        entry: bash -c 'cd frontend && npm run build'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

